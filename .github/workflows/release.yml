name: publicar release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag estável existente a publicar (vX.Y.Z)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Conferir preparacao temporaria das notas
        run: node --test .github/scripts/preparar-nota-release.test.mjs
      - name: Conferir tag estável, commit, versão e notas
        id: release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag || '')) throw new Error('A publicação exige uma tag estável vX.Y.Z, sem RC ou prerelease.');
          const pkg = JSON.parse(fs.readFileSync('core/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('core/package-lock.json', 'utf8'));
          if (tag !== `v${pkg.version}` || lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('A tag e as versões do pacote/lockfile precisam ser idênticas.');
          const notes = `docs/releases/${tag}.md`;
          if (!fs.statSync(notes).isFile() || !fs.readFileSync(notes, 'utf8').trim()) throw new Error('As notas desta versão precisam existir e ter conteúdo.');
          NODE
          commit="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$commit" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          fi
          test "$commit" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências dos materiais e currículo
        run: pip install reportlab pypdf python-docx
      - name: Criar estado local neutro sem concluir onboarding
        run: node migrar-layout.mjs .
      - name: Instalar dependências locais do núcleo
        working-directory: core
        run: npm ci --ignore-scripts
      - name: Testes do núcleo
        working-directory: core
        run: |
          TMPDIR="$RUNNER_TEMP" npm test
      - name: Verificar transição de layout e preservação da versão anterior
        working-directory: core
        env:
          JOBRELAY_TEST_UPGRADE_CANDIDATE: ${{ steps.release.outputs.commit }}
        run: node --test tests/upgrade-release.test.js
      - name: Conferir ausência de dados pessoais no pacote
        working-directory: core
        run: npm run checar:publico
      - name: Testes do currículo
        run: python3 -m unittest discover -s skills/adapt-resume/tests -p 'test_*.py'
      - name: Gerar e conferir os currículos nos dois idiomas
        working-directory: skills/adapt-resume
        run: |
          python3 generate_resume.py ../../local/curriculo/base_content_pt.json "$RUNNER_TEMP/jobrelay-pt.pdf"
          python3 verificar_resume.py "$RUNNER_TEMP/jobrelay-pt.pdf" ../../local/curriculo/base_content_pt.json
          python3 generate_resume.py ../../local/curriculo/base_content_en.json "$RUNNER_TEMP/jobrelay-en.pdf"
          python3 verificar_resume.py "$RUNNER_TEMP/jobrelay-en.pdf" ../../local/curriculo/base_content_en.json
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Instalar interface pelo lockfile
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Tipos e lint da interface
        working-directory: app
        run: |
          pnpm typecheck
          pnpm exec eslint src/components/job-board.tsx src/lib src/pages/api
      - name: Testes da interface
        working-directory: app
        run: node --test src/lib/*.test.ts
      - name: Build da interface
        working-directory: app
        run: pnpm build
      - name: Gerar ZIP somente dos arquivos rastreados no commit
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          mkdir "$RUNNER_TEMP/jobrelay-source"
          git archive --format=tar "$RELEASE_COMMIT" | tar -x -C "$RUNNER_TEMP/jobrelay-source"
          python3 "$RUNNER_TEMP/jobrelay-source/core/scripts/materializar-distribuicao.py" "$RUNNER_TEMP/jobrelay-source" "$RUNNER_TEMP/jobrelay-pacote" "$RUNNER_TEMP/jobrelay.zip"
          test -s "$RUNNER_TEMP/jobrelay.zip"
          unzip -t "$RUNNER_TEMP/jobrelay.zip"
      - name: Testar a CLI 1.5.3 com o mesmo ZIP e a proxima entrada normal
        working-directory: core
        env:
          JOBRELAY_TEST_UPGRADE_CANDIDATE: ${{ steps.release.outputs.commit }}
          JOBRELAY_TEST_UPGRADE_ASSET: ${{ runner.temp }}/jobrelay.zip
        run: node --test tests/upgrade-153-cli.test.js
      - name: Publicar nova release estável com o ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'A release %s já existe; nada será sobrescrito.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          node .github/scripts/preparar-nota-release.mjs "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/jobrelay-notas.md"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const texto = fs.readFileSync(`${process.env.RUNNER_TEMP}/jobrelay-notas.md`, 'utf8');
          if (texto.includes('DATA_PUBLICACAO')) throw new Error('As notas temporarias ainda contem marcador de data.');
          NODE
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/jobrelay.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "JobRelay $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/jobrelay-notas.md" \
            --latest
