name: testes

on:
  push:
  pull_request:

jobs:
  radar:
    strategy:
      matrix:
        node: ["20", "22.23.4"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vagas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências dos testes de materiais
        run: pip install reportlab pypdf python-docx
      - name: Conferir lockfile Node
        run: npm ci --ignore-scripts
      - name: Testes do radar, sem rede
        run: npm test
      - name: Nenhum dado pessoal em arquivo versionável
        run: npm run checar:publico

  curriculo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências do gerador de PDF
        run: pip install reportlab pypdf python-docx
      - name: Testes do currículo
        run: python3 -m unittest discover -s Skills/adapt-resume/tests -p "test_*.py"
      - name: O exemplo gera e passa no verificador, nos dois idiomas
        working-directory: Skills/adapt-resume
        run: |
          python3 generate_resume.py base_content_pt.json /tmp/pt.pdf
          python3 verificar_resume.py /tmp/pt.pdf base_content_pt.json
          python3 generate_resume.py base_content_en.json /tmp/en.pdf
          python3 verificar_resume.py /tmp/en.pdf base_content_en.json

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec eslint src/components/job-board.tsx src/lib src/pages/api
      - run: node --test src/lib/*.test.ts
      - run: pnpm build

  upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vagas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Upgrade da release anterior para o commit exato, sem rede
        env:
          JOBRELAY_TEST_UPGRADE_CANDIDATE: ${{ github.sha }}
        run: node --test test/upgrade-release.test.js
